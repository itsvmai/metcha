<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Metcha Café - Checkout</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="parallax-bg"></div>
  <header>
    <nav>
      <div class="logo">Metcha Café</div>
      <ul class="nav-links">
        <li><a href="index.html#home">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a></li>
        <li><a href="checkout.html">Checkout</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <main id="checkout">
    <h2 class="section-title">Checkout</h2>
    <div style="max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:2rem;">
      <div class="auth-container" style="padding:3rem;">
        <h3 style="font-size:1.8rem;font-weight:700;margin-bottom:2rem;background:linear-gradient(135deg,#ff6b9d,#c77dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Payment Information</h3>
        <form id="checkout-form">
          <div class="form-group"><label for="card-name">Cardholder Name</label><input type="text" id="card-name" required></div>
          <div class="form-group"><label for="card-number">Card Number</label><input type="text" id="card-number" placeholder="1234 5678 9012 3456" maxlength="19" required></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group"><label for="card-expiry">Expiry Date</label><input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5" required></div>
            <div class="form-group"><label for="card-cvv">CVV</label><input type="text" id="card-cvv" placeholder="123" maxlength="3" required></div>
          </div>
          <div class="form-group"><label for="billing-address">Billing Address</label><input type="text" id="billing-address" required></div>
          <button type="submit" class="submit-button"><span class="button-text">Complete Purchase</span><span class="spinner hidden"></span></button>
        </form>
        <div id="checkout-message" style="margin-top:1rem;"></div>
      </div>
      <div class="auth-container" style="padding:3rem;">
        <h3 style="font-size:1.8rem;font-weight:700;margin-bottom:2rem;background:linear-gradient(135deg,#ff6b9d,#c77dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Order Summary</h3>
        <div id="checkout-summary"></div>
      </div>
    </div>
  </main>

  <!-- Footer (same) -->
  <footer>…same footer as above…</footer>
  <script src="script.js"></script>
</body>
</html>
